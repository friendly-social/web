<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="
            width=device-width, initial-scale=1, maximum-scale=1,
            interactive-widget=resizes-content, viewport-fit=cover"
        />
        <title>Friendly Web</title>
        <meta name="description" content="Web client for Friendly" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/favicon-light.svg"
            media="(prefers-color-scheme: light) and (display-mode: browser)"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/favicon-dark.svg"
            media="(prefers-color-scheme: dark), (display-mode: standalone)"
        />
        <meta name="apple-mobile-web-app-title" content="Friendly" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <!-- Waiting until support of mode switching arrives to PWA. Only dark mode -->
        <!-- is supported on PWA until then. -->
        <meta
            name="theme-color"
            content="#fcfcfc"
            media="(prefers-color-scheme: light) and (display-mode: browser)"
        />
        <meta
            name="theme-color"
            content="#191919"
            media="(prefers-color-scheme: dark), (display-mode: standalone)"
        />
    </head>
    <body class="bg-background">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
